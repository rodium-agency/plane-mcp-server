name: Work item archive HTTP contract

on:
  pull_request:
    branches: [main]
    paths:
      - "plane_mcp/**"
      - "tests/tools/**"
      - "pyproject.toml"
      - ".github/workflows/test-archive-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/tools/test_workitem_archive_http.py -q
